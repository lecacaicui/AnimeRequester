<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIME-CHAN</title>
    <link rel="stylesheet" href="./CSS/style.css">
    <script src="./JS/script.js" defer></script>
</head>
<body>
    <header id="header-container"></header>

    <main>

        <section class="presentation">
            <h1>Bienvenue sur ANIME-CHAN</h1>
            <p>Découvrez les meilleurs animes du moment !</p>

            <div class="carrousel">
                <img src="./images/anime1.jpg" alt="Anime 1">
                <img src="./images/anime2.jpg" alt="Anime 2">
                <img src="./images/anime3.jpg" alt="Anime 3">
            </div>

        </section>

        <section class="resultats">
            
            <div id="resultsContainer">
                <h2 id="resultsTitle">Titre</h2>
                <img id="resultsImage" src="" alt="Image de l'anime">
                <p id="resultsSynopsis">Synopsis</p>
            </div>

            <div id="statsContainer">
                <h3>Statistiques</h3>
                <p id="genre">Genre : </p>
                <p id="resultsEpisodes">Nombre d'épisodes : </p>
                <p id="resultsRank">Classement : </p>
            </div>

        </section>

    </main>

    <footer id="footer-container"></footer>
    
</body>
</html>
