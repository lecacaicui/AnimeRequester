<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIME-CHAN</title>
    <link rel="stylesheet" href="./CSS/style.css">
    <script src="./JS/script.js" defer></script>
</head>
<body>
    <header id="header-container"></header>

    <main>

        <section class="presentation">
            <h1>Bienvenue sur ANIME-CHAN</h1>
            <p>Découvrez les meilleurs animes du moment !</p>

            <div class="carrousel">
                <button id="prevBtn" class="carrousel-btn">&#10094;</button>
                
                <div class="carrousel-contenu">
                    <img id="carrouselImage" src="" alt="Chargement...">
                    <h3 id="carrouselTitre">Chargement des animés...</h3>
                </div>

                <button id="nextBtn" class="carrousel-btn">&#10095;</button>
            </div>

        </section>

        <section class="resultats">
            
            <div id="resultsContainer">
                <h2 id="resultsTitle">Titre</h2>
                <img id="resultsImage" src="" alt="Image de l'anime">
                <p id="resultsSynopsis">Synopsis</p>
            </div>

            <div id="statsContainer">
                <h3>Statistiques</h3>
                <p id="genre">Genre : </p>
                <p id="resultsEpisodes">Nombre d'épisodes : </p>
                <p id="resultsRank">Classement : </p>
            </div>

        </section>

        <section class="classement">
            <h2>Top 10 des animes</h2>
            <p>Découvrez le classement des 10 meilleurs animes !</p>

            <div id="classementContainer">
                <!-- METS LES RESULTATS LA OU JE TE MARAVE-->
            </div>

            <div class="voir-plus">
                <a href="classement.html">Voir plus</a>
            </div>

        </section>

    </main>

    <footer id="footer-container"></footer>
    
</body>
</html>
