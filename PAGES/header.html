<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIME-CHAN</title>
    <link rel="stylesheet" href="./CSS/style.css">
    <script src="./JS/script.js" defer></script>
</head>
<body>
    <header>
        <h1 class="nomSite">ANIME-CHAN</h1>
        <section>
            
        <form class="recherche" action="" method="get">
            <div class="search-container">
                <button type="submit" class="search-btn">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
                <input type="text" name="query" placeholder="Rechercher...">
            </div>
            
            <button type="button" id="randomButton" class="random-btn">Anime aléatoire</button>
        </form>
        </section>
    </header>
</body>
</html>
